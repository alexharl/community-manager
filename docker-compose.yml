name: community-manager

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cm}
      POSTGRES_USER: ${POSTGRES_USER:-cm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cm}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  onlyoffice:
    image: onlyoffice/documentserver:9.4.0.1
    restart: unless-stopped
    environment:
      JWT_ENABLED: 'true'
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET fehlt in .env}
      # Erlaubt dem Document Server, das Backend im Docker-Netz bzw. auf dem Host zu erreichen
      ALLOW_PRIVATE_IP_ADDRESS: 'true'
      ALLOW_META_IP_ADDRESS: 'true'
    ports:
      - '${ONLYOFFICE_PORT:-8090}:80'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice

volumes:
  pgdata:
  onlyoffice_data:
  onlyoffice_logs:
