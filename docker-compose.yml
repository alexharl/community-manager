name: community-manager

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cm}
      POSTGRES_USER: ${POSTGRES_USER:-cm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cm}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  onlyoffice:
    image: onlyoffice/documentserver:9.4.0.1
    restart: unless-stopped
    environment:
      JWT_ENABLED: 'true'
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET fehlt in .env}
      # Erlaubt dem Document Server, das Backend im Docker-Netz bzw. auf dem Host zu erreichen
      ALLOW_PRIVATE_IP_ADDRESS: 'true'
      ALLOW_META_IP_ADDRESS: 'true'
    ports:
      - '${ONLYOFFICE_PORT:-8090}:80'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice

  # Produktivbetrieb: Backend + Frontend in einem Container (docker compose --profile prod up -d)
  app:
    build: .
    image: community-manager:latest
    profiles: ['prod']
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
      onlyoffice:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cm}:${POSTGRES_PASSWORD:-cm}@db:5432/${POSTGRES_DB:-cm}
      APP_SECRET: ${APP_SECRET:?APP_SECRET fehlt in .env}
      # Browser → Document Server (öffentliche Adresse, hinter dem Reverse-Proxy)
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:?ONLYOFFICE_PUBLIC_URL fehlt in .env}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET fehlt in .env}
      # Container untereinander im Docker-Netz
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      BACKEND_URL_FOR_ONLYOFFICE: http://app:3000
      TZ: ${TZ:-Europe/Berlin}
      # Veranstaltungen für smarte Vorlagen (optional)
      EVENTS_SOURCE: ${EVENTS_SOURCE:-none}
      EVENTS_URL: ${EVENTS_URL:-}
    ports:
      - '${APP_PORT:-3080}:3000'
    volumes:
      - appdata:/data

  # Nur Entwicklung: fängt alle Mails ab, nichts geht nach außen (Weboberfläche auf :8025)
  mailpit:
    image: axllent/mailpit:v1.31.4
    profiles: ['dev']
    restart: unless-stopped
    environment:
      # Jede Anmeldung ohne TLS akzeptieren, wie ein echtes SMTP-Konto mit Benutzer/Passwort
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  pgdata:
  appdata:
  onlyoffice_data:
  onlyoffice_logs:
